<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ElevatorMeet</title>
    <style>
      body {
        background-color: #1c1b1b;
        width: 260px;
        font-family:
          'Inter',
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        letter-spacing: 1px;
        margin: 0;
        color: #e5e2e1;
      }
      header {
        background-color: #1c1b1b;
        padding: 16px 16px 6px;
      }
      .title {
        display: flex;
        align-items: flex-end;
        margin-bottom: 6px;
      }
      .title svg {
        width: 36px;
        height: 36px;
        margin-right: 6px;
      }
      .title svg path {
        fill: #ff7000;
      }
      h1 {
        font-size: 24px;
        font-weight: bold;
        margin: 0;
      }
      .subtitle {
        font-size: 12px;
        line-height: 15px;
        color: #b9cacb;
        margin: 0 0 14px;
      }
      .content {
        background-color: #232323;
        padding: 16px;
      }
      .control-container {
        margin-bottom: 14px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      label {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        margin-bottom: 4px;
        color: #b9cacb;
      }
      span.val {
        font-weight: 600;
        color: #ff7000;
      }
      input[type='range'] {
        width: 100%;
        accent-color: #ff7000;
      }
      .range-desc {
        display: flex;
        justify-content: space-between;
        font-size: 9px;
        color: #b9cacbdd;
      }
      select {
        width: 100%;
        padding: 6px 8px;
        font-size: 12px;
        border-radius: 2px;
        border: 1px solid #b9cacb;
        background: #3b3b3b;
        color: #b9cacb;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 12px 0;
        border: none;
        border-radius: 2px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      #toggleBtn {
        border: 2px solid #ff7000;
        color: #000000;
        background: #ff7000;
      }
      #toggleBtn.running {
        background: #000000;
        color: #ff7000;
      }
      .status {
        flex: 1;
      }
      #status {
        font-family: monospace;
        font-size: 12px;
        color: #707786;
      }
      #statusIndicator {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #dc2626;
        margin-right: 6px;
        box-shadow: 0 0 3px 2px #dc2626;
      }
      footer {
        background-color: #000000;
        padding: 8px;
        font-size: 10px;
        color: #ff7000;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: flex-end;
        align-items: flex-end;
      }
    </style>
  </head>

        <h1>Elevator Meet</h1>
      </div>
      <p class="subtitle">
        Fills the awkward silence, then gets out of the way.
      </p>
    </header>

    <div class="content">
      <div class="control-container">
        <label for="trackSelect">TRACK</label>
        <select
          id="trackSelect"
          aria-description="Select a track to play in the background"
        ></select>
      </div>

      <div class="control-container">
        <div class="row">
          <label for="silenceRange" title="title">SILENCE</label>
          <span
            class="val"
            id="silenceVal"
            aria-description="Set the time in seconds to wait for silence before music starts"
          >
            5s
          </span>
        </div>
        <input
          type="range"
          id="silenceRange"
          min="2"
          max="15"
          step="1"
          value="5"
        />
      </div>

      <div class="control-container">
        <div class="row">
          <label for="volRange">THRESHOLD</label>
          <span
            class="val"
            id="volVal"
            aria-description="Set the listening threshold - lower is more sensitive"
          >
            6
          </span>
        </div>
        <input type="range" id="volRange" min="1" max="30" step="1" value="6" />
        <div class="range-desc">
          <span>more sensitive</span>
          <span>less sensitive</span>
        </div>
      </div>

      <div class="control-container">
        <div class="row">
          <label for="fadeInRange">FADE IN</label>
          <span class="val" id="fadeInVal">0.4s</span>
        </div>
        <input
          type="range"
          id="fadeInRange"
          min="0"
          max="5"
          step="0.1"
          value="0.4"
          aria-description="Set the music fade-in time"
        />
      </div>

      <div class="control-container">
        <div class="row">
          <label for="fadeOutRange">FADE OUT</label>
          <span class="val" id="fadeOutVal">0.4s</span>
        </div>
        <input
          type="range"
          id="fadeOutRange"
          min="0"
          max="2"
          step="0.1"
          value="0.4"
          aria-description="Set the music fade-out time"
        />
      </div>

      <div class="control-container">
        <div class="row">
          <label for="musicVolRange">VOLUME</label>
          <span class="val" id="musicVolVal">50%</span>
        </div>

        <input
          type="range"
          id="musicVolRange"
          min="0"
          max="100"
          step="5"
          value="50"
          aria-description="Set the music volume level"
        />
      </div>

      <button
        id="toggleBtn"
        aria-pressed="false"
        aria-description="Start listening to silence"
      >
        Start
      </button>
    </div>

    <footer>
      <div class="status">
        <span id="statusIndicator"></span><span id="status">Standby</span>
      </div>
      <span>v0.1.0</span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
